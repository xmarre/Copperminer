name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  release:
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: copperminer-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish versioned source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 0.1.0."
            exit 1
          fi
          tag="v${version}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/copperminer-release-state"; then
            if [[ "$(cat "$RUNNER_TEMP/copperminer-release-state")" == "false" ]]; then
              echo "Release ${tag} is already published."
              exit 0
            fi
            resume_draft=true
          else
            resume_draft=false
          fi
          archive="$RUNNER_TEMP/Copperminer-${tag}.zip"
          git archive --format=zip --prefix="Copperminer-${tag}/" --output="$archive" "$GITHUB_SHA"
          if [[ "$resume_draft" == "true" ]]; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" --target "$GITHUB_SHA" --title "Copperminer ${tag}" --notes-file CHANGELOG.md --draft
          fi
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json url,isDraft,assets
